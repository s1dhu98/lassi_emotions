<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071029"/>
      <stop offset="50%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#18233c"/>
    </linearGradient>

    <!-- Glass Liquid Gradient -->
    <linearGradient id="lassiLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="50%" stop-color="#ffd57e"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <!-- Saffron / Top Glow -->
    <radialGradient id="topGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Clip Path -->
    <clipPath id="glassClip">
      <path d="M120 60 L360 60 L320 540 L160 540 Z" />
    </clipPath>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="250" cy="200" r="180" fill="#ffd57e" opacity="0.08" filter="url(#glow)" />
  <circle cx="950" cy="450" r="220" fill="#ff4081" opacity="0.08" filter="url(#glow)" />

  <!-- Left Side: Interactive Glass Art -->
  <g transform="translate(80, 20)">
    <!-- Ambient Glow behind Glass -->
    <ellipse cx="240" cy="300" rx="160" ry="200" fill="#ffb703" opacity="0.15" filter="url(#glow)" />

    <!-- Glass Outline -->
    <path d="M120 60 L360 60 L320 540 L160 540 Z" fill="rgba(255,255,255,0.04)" stroke="#bcd" stroke-width="4" />

    <!-- Liquid Fill -->
    <g clip-path="url(#glassClip)">
      <rect x="120" y="180" width="240" height="370" rx="20" ry="20" fill="url(#lassiLiquid)"/>
      <path d="M120 220 Q180 190 240 220 T360 220 L360 540 L120 540 Z" fill="#fff8ee" opacity="0.85"/>
      
      <!-- Face -->
      <ellipse cx="200" cy="300" rx="12" ry="10" fill="#1e293b"/>
      <ellipse cx="280" cy="300" rx="12" ry="10" fill="#1e293b"/>
      <path d="M210 350 Q240 385 270 350" stroke="#d97706" stroke-width="6" stroke-linecap="round" fill="none"/>

      <!-- Topping (Saffron strands & Pistachio) -->
      <circle cx="210" cy="225" r="8" fill="#76ba1b" />
      <circle cx="250" cy="220" r="6" fill="#76ba1b" />
      <path d="M225 215 C230 210, 235 212, 240 205" stroke="#ff9900" stroke-width="3" fill="none"/>
      <path d="M255 222 C260 215, 265 218, 270 210" stroke="#ff9900" stroke-width="3" fill="none"/>
    </g>

    <!-- Glass Reflections -->
    <path d="M140 100 C170 80, 200 80, 230 100" stroke="#ffffff" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M150 140 L140 500" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Right Side: Project Title & Features Showcase -->
  <g transform="translate(560, 100)">
    <!-- Main Title -->
    <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#ffffff">
      Lassi Emotions <tspan fill="#ffd57e">✨</tspan>
    </text>
    
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#94a3b8">
      Interactive Sentiment & Emotion Visualization Engine
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 120)">
      <!-- Badge 1: 50+ Emotions -->
      <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(255,213,126,0.12)" stroke="#ffd57e" stroke-width="1.5"/>
      <text x="80" y="25" font-family="sans-serif" font-weight="600" font-size="15" fill="#ffd57e" text-anchor="middle">🎭 50+ Emotions</text>

      <!-- Badge 2: NLP Engine -->
      <rect x="175" y="0" width="180" height="40" rx="20" fill="rgba(79,172,254,0.12)" stroke="#4facfe" stroke-width="1.5"/>
      <text x="265" y="25" font-family="sans-serif" font-weight="600" font-size="15" fill="#4facfe" text-anchor="middle">🧠 NLP Sentiment AI</text>

      <!-- Badge 3: Hindi & English -->
      <rect x="370" y="0" width="170" height="40" rx="20" fill="rgba(250,112,154,0.12)" stroke="#fa709a" stroke-width="1.5"/>
      <text x="455" y="25" font-family="sans-serif" font-weight="600" font-size="15" fill="#fa709a" text-anchor="middle">🌐 EN / HI Dual i18n</text>
    </g>

    <!-- Glassmorphic Card Showcase -->
    <g transform="translate(0, 200)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="560" height="230" rx="20" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      
      <!-- Card Content -->
      <text x="30" y="45" font-family="sans-serif" font-weight="700" font-size="20" fill="#ffffff">🚀 Engine Highlights</text>
      
      <text x="30" y="90" font-family="sans-serif" font-size="16" fill="#cbd5e1">
        • <tspan font-weight="600" fill="#ffd57e">Modular Architecture:</tspan> Clean ES Modules & CSS Design System
      </text>

      <text x="30" y="130" font-family="sans-serif" font-size="16" fill="#cbd5e1">
        • <tspan font-weight="600" fill="#4facfe">Interactive Controls:</tspan> Intensity sliders, Toppings, Custom Themes
      </text>

      <text x="30" y="170" font-family="sans-serif" font-size="16" fill="#cbd5e1">
        • <tspan font-weight="600" fill="#fa709a">Gamification & Storage:</tspan> Streaks, Achievement Badges, Favorites
      </text>

      <text x="30" y="210" font-family="sans-serif" font-size="14" fill="#64748b">
        Open Source • Zero Dependencies • Production Ready Showcase
      </text>
    </g>
  </g>
</svg>
